name: Enable GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Enable Pages from the default branch root
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          gh api "/repos/${GITHUB_REPOSITORY}/pages"
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Pages already configured"
            exit 0
          fi
          gh api --method POST "/repos/${GITHUB_REPOSITORY}/pages" \
            -f build_type=legacy \
            -f source[branch]=main \
            -f source[path]='/'
          gh api "/repos/${GITHUB_REPOSITORY}/pages"
